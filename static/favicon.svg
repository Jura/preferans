<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Outer background (dark felt) -->
  <rect width="32" height="32" fill="#1b4332"/>
  <!-- Gold border frame -->
  <rect x="3" y="3" width="26" height="26" fill="#c8a96e"/>
  <!-- Inner green felt -->
  <rect x="4" y="4" width="24" height="24" fill="#245c42"/>

  <!-- Pixel spade (black with white outline) — centred left -->
  <!-- White outline pixels -->
  <rect x="9"  y="6"  width="2" height="1" fill="#fff"/>
  <rect x="7"  y="7"  width="6" height="1" fill="#fff"/>
  <rect x="6"  y="8"  width="8" height="1" fill="#fff"/>
  <rect x="5"  y="9"  width="10" height="1" fill="#fff"/>
  <rect x="5"  y="10" width="10" height="1" fill="#fff"/>
  <rect x="6"  y="11" width="8" height="1" fill="#fff"/>
  <rect x="7"  y="12" width="3" height="1" fill="#fff"/>
  <rect x="9"  y="13" width="2" height="1" fill="#fff"/>
  <rect x="8"  y="14" width="4" height="1" fill="#fff"/>
  <rect x="7"  y="15" width="6" height="2" fill="#fff"/>

  <!-- Black spade fill -->
  <rect x="10" y="7"  width="1" height="1" fill="#1a1a1a"/>
  <rect x="8"  y="8"  width="5" height="1" fill="#1a1a1a"/>
  <rect x="7"  y="9"  width="7" height="1" fill="#1a1a1a"/>
  <rect x="7"  y="10" width="7" height="1" fill="#1a1a1a"/>
  <rect x="8"  y="11" width="5" height="1" fill="#1a1a1a"/>
  <rect x="9"  y="12" width="3" height="1" fill="#1a1a1a"/>
  <rect x="10" y="13" width="1" height="1" fill="#1a1a1a"/>
  <rect x="9"  y="14" width="3" height="1" fill="#1a1a1a"/>
  <rect x="8"  y="15" width="5" height="1" fill="#1a1a1a"/>

  <!-- Pixel heart (red) — top right -->
  <rect x="20" y="7"  width="1" height="1" fill="#c62f2a"/>
  <rect x="22" y="7"  width="1" height="1" fill="#c62f2a"/>
  <rect x="19" y="8"  width="3" height="1" fill="#c62f2a"/>
  <rect x="21" y="8"  width="3" height="1" fill="#c62f2a"/>
  <rect x="19" y="9"  width="5" height="1" fill="#c62f2a"/>
  <rect x="20" y="10" width="3" height="1" fill="#c62f2a"/>
  <rect x="21" y="11" width="1" height="1" fill="#c62f2a"/>

  <!-- Pixel diamond (red) — bottom right -->
  <rect x="21" y="18" width="1" height="1" fill="#c62f2a"/>
  <rect x="20" y="19" width="3" height="1" fill="#c62f2a"/>
  <rect x="19" y="20" width="5" height="1" fill="#c62f2a"/>
  <rect x="20" y="21" width="3" height="1" fill="#c62f2a"/>
  <rect x="21" y="22" width="1" height="1" fill="#c62f2a"/>
</svg>
